version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd coffeeland-react
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: coffeeland-react/dist
    files:
      - '**/*'
  cache:
    paths:
      - coffeeland-react/node_modules/**/*
