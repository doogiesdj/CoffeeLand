<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Direct Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
</head>
<body style="margin:0;padding:20px;font-family:Arial;">
    <h1>🧪 Direct Cytoscape Test</h1>
    
    <button id="btn1" style="padding:10px 20px;margin:5px;font-size:16px;cursor:pointer;">
        Test 1: Basic Graph
    </button>
    
    <button id="btn2" style="padding:10px 20px;margin:5px;font-size:16px;cursor:pointer;">
        Test 2: Load RDF
    </button>
    
    <div id="cy" style="width:100%;height:500px;border:2px solid #333;margin:20px 0;background:white;"></div>
    
    <div id="log" style="background:#f5f5f5;padding:15px;border-radius:5px;font-family:monospace;"></div>
    
    <script>
        const logDiv = document.getElementById('log');
        
        function log(msg) {
            logDiv.innerHTML += '<div>' + new Date().toLocaleTimeString() + ' - ' + msg + '</div>';
        }
        
        log('✅ Page loaded');
        log('📦 Cytoscape version: ' + (typeof cytoscape !== 'undefined' ? cytoscape.version : 'NOT LOADED'));
        
        let cy = null;
        
        document.getElementById('btn1').addEventListener('click', function() {
            log('🔵 Button 1 clicked');
            
            const container = document.getElementById('cy');
            log('📐 Container size: ' + container.offsetWidth + 'x' + container.offsetHeight);
            
            try {
                cy = cytoscape({
                    container: container,
                    elements: [
                        { data: { id: 'a', label: 'Node A' } },
                        { data: { id: 'b', label: 'Node B' } },
                        { data: { id: 'c', label: 'Node C' } },
                        { data: { source: 'a', target: 'b' } },
                        { data: { source: 'b', target: 'c' } }
                    ],
                    style: [
                        {
                            selector: 'node',
                            style: {
                                'background-color': '#2d72d2',
                                'label': 'data(label)',
                                'color': '#fff',
                                'text-outline-color': '#2d72d2',
                                'text-outline-width': 2
                            }
                        },
                        {
                            selector: 'edge',
                            style: {
                                'width': 2,
                                'line-color': '#8b6f47',
                                'target-arrow-shape': 'triangle'
                            }
                        }
                    ],
                    layout: { name: 'circle' }
                });
                
                log('✅ Graph created! Nodes: ' + cy.nodes().length + ', Edges: ' + cy.edges().length);
            } catch (error) {
                log('❌ Error: ' + error.message);
            }
        });
        
        document.getElementById('btn2').addEventListener('click', async function() {
            log('🔵 Button 2 clicked');
            
            try {
                const response = await fetch('/api/rdf/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: '1768301363919-coffeeland.rdf' })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    log('✅ RDF loaded: ' + result.count + ' triples');
                    log('Sample: ' + JSON.stringify(result.triples[0]));
                } else {
                    log('❌ Failed: ' + result.error);
                }
            } catch (error) {
                log('❌ Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
